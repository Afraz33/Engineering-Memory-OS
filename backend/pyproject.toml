[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-auth>=2.56.3",
    "google-genai>=1.0.0",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.52.1",
]

[project.optional-dependencies]
# Only needed if LLM_PROVIDER is switched to one of these.
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.60.0"]

[project.scripts]
init-db = "db.init_db:init_db"
