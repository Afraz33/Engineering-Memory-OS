services:
  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env          # loads SLACK_BOT_TOKEN, SLACK_APP_TOKEN, etc.
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets container reach host on Linux
    environment:
      DATABASE_URL: postgresql://root@cockroach:26257/engineering_memory?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      init-db:
        condition: service_completed_successfully
      redis:
        condition: service_started

  init-db:
    build:
      context: ./backend
      target: dev
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://root@cockroach:26257/engineering_memory?sslmode=disable
    command: ["uv", "run", "python", "-m", "db.init_db"]
    depends_on:
      cockroach:
        condition: service_healthy

  cockroach:
    image: cockroachdb/cockroach:v25.3.3
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  cockroach-data:
  redis-data: