services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
      target: prod

  backend:
    build:
      context: ./backend
      target: prod
    environment:
      DATABASE_URL: postgresql://root@cockroach:26257/engineering_memory?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      init-db:
        condition: service_completed_successfully
      redis:
        condition: service_started

  init-db:
    build:
      context: ./backend
      target: prod
    environment:
      DATABASE_URL: postgresql://root@cockroach:26257/engineering_memory?sslmode=disable
    command: ["uv", "run", "python", "-m", "db.init_db"]
    depends_on:
      cockroach:
        condition: service_healthy

  cockroach:
    image: cockroachdb/cockroach:v25.3.3
    command: start-single-node --insecure
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

volumes:
  cockroach-data:
  redis-data: