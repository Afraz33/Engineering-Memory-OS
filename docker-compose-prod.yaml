services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
      target: prod

  backend:
    build:
      context: ./backend
      target: prod
    environment:
      DATABASE_URL: postgresql://root@cockroach:26257/engineering_memory?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - cockroach
      - redis

  cockroach:
    image: cockroachdb/cockroach:v25.3.3
    command: start-single-node --insecure
    volumes:
      - cockroach-data:/cockroach/cockroach-data

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

volumes:
  cockroach-data:
  redis-data: